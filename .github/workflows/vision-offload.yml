name: vision-offload-checks
on:
  push:
    branches: [vision-offload]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vision-offload-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: CPU suite (does not validate the CUDA forward pass)
        run: cargo test --locked --workspace --target ${{ matrix.target }}
